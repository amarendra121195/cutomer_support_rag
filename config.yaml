# Central configuration for the RAG pipeline.
# All paths are relative to the project root. The OpenAI key lives in .env, not here.

data:
  dir: rag_datasets                 # created by download_datasets.py
  wixqa:
    kb_file: wixqa_wix_kb_corpus_train.csv
  bitext:
    enabled: true
    file: bitext_train.csv
    max_per_intent: 100             # Bitext has ~1,000 near-duplicate rows per intent; index this many of each
    eval_per_intent: 10             # held out of the index and used as test questions
    seed: 42

chunking:
  chunk_size: 900                   # characters, about 200 tokens. Smaller chunks match more precisely,
                                    # larger ones give the LLM more context per chunk
  chunk_overlap: 150                # characters repeated between neighbouring chunks of the same section

embeddings:
  model: text-embedding-3-large     # OpenAI, $0.13 per million tokens
  dimensions: null                  # null = the model's full 3,072. A smaller value such as 1024 shrinks
                                    # the index proportionally for a small loss in accuracy
  batch_size: 128                   # chunks per API request, about 19k tokens (API limits: 2,048 inputs
                                    # and 300k tokens per request, plus your account's tokens-per-minute)

vectordb:
  path: vector_store                # ChromaDB persistence directory
  collection: support_kb

retrieval:
  top_k: 5                          # chunks handed to the LLM
  fetch_k: 30                       # how deep the evaluation ranks, and the pool the reranker picks from
  sources: null                     # null = search everything, or a list such as [wixqa]
  rerank:
    enabled: false                  # local cross-encoder, needs sentence-transformers. Off by default:
                                    # in testing it cost ~1s per query for a gain inside the noise.
                                    # Check on your own index with `python main.py evaluate --rerank`
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    num_threads: 4                  # PyTorch CPU threads; on Intel CPUs with performance + efficiency
                                    # cores, use the number of performance cores

llm:
  model: gpt-6.1-sol                # $2 / $10 per million input / output tokens.
                                    # gpt-6-luna is 20x cheaper, gpt-6-astra the most capable (5x the price)
  max_output_tokens: 16000          # ceiling for reasoning + answer; real answers are far shorter
  effort: medium                    # reasoning effort: low | medium | high | xhigh | max

evaluation:
  dataset: expertwritten            # expertwritten | simulated | synthetic | bitext
  k_values: [1, 3, 5, 10]
  judge_model: gpt-6-luna           # grades the answers. Keep it different from llm.model so the
                                    # generator is not grading itself; gpt-6-astra is a stricter, pricier judge
  judge_effort: medium
  concurrency: 4                    # parallel LLM calls during generation evaluation
  output_dir: evaluation_results

api:
  host: 127.0.0.1
  port: 8000

logging:
  level: INFO
  file: logs/app.log
